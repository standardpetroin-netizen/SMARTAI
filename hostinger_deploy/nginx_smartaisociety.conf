# =========================================================================
# Nginx Reverse Proxy Configuration for smartaisociety
# File location on Hostinger VPS: /etc/nginx/sites-available/smartaisociety
# =========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your custom domain or VPS IP (e.g. smartaisociety.com *.smartaisociety.com)

    # Max upload file size for resident avatar, maintenance receipts & attachments
    client_max_body_size 50M;

    # Gzip Compression for high performance on Hostinger KVM2 NVMe
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for IoT Telemetry & Real-Time Security Alerts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static file asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
